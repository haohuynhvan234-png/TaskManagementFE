<script>
    // Simple script to handle select styling based on priority
    document.addEventListener('DOMContentLoaded', () => {
        const prioritySelect = document.getElementById('task-priority');
        
        const updateSelectColor = () => {
            const val = prioritySelect.value;
            // Reset classes
            prioritySelect.classList.remove('text-on-surface', 'text-error', 'text-secondary', 'text-tertiary-container');
            
            if(val === 'high') {
                prioritySelect.classList.add('text-error', 'font-semibold');
            } else if(val === 'medium') {
                prioritySelect.classList.add('text-tertiary-container', 'font-semibold');
            } else {
                prioritySelect.classList.add('text-secondary', 'font-semibold');
            }
        };

        prioritySelect.addEventListener('change', updateSelectColor);
        updateSelectColor(); // Init
    });
